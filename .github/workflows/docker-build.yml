name: Build and Publish Docker Image

# 🔴 A imagem sai da RELEASE, e de mais nada.
#
# Até 07/10/2026 o gatilho era `push` na `main`, e esta é a edição que roda em instalação de
# CLIENTE: uma PR mesclada chegava ao cliente no próximo restart dele, sem release, sem nota e sem
# ninguém decidir que era hora.
#
# `released` e não `published`: o segundo também dispara para pré-lançamento, e pré-lançamento não é
# o que o parque deve receber.
on:
  release:
    types: [released]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The `enterprise/` directory carries the Chatwoot Enterprise License,
      # which allows use in production only with a valid Enterprise
      # subscription and forbids selling. We have never held one and do not use
      # anything it provides: no premium feature is enabled on any account, and
      # `pricing_plan` is community everywhere. Shipping it anyway put licensed
      # third-party code on our servers and on customers' — for nothing.
      #
      # This is what upstream itself does to publish the FOSS image
      # (publish_foss_docker.yml), and what ci-spec.yml here has always done
      # before running the suite: our specs pass without it.
      #
      # It removes the enterprise-gated endpoints (Twilio voice, WhatsApp
      # calling, conference, reporting_events, the Chatwoot Cloud billing
      # namespace) and stops the audit trail from being written. All of it
      # unused here.
      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ env.PLATFORM_PAIR }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `:latest` moves on every build, so it is not something a deployment can
      # roll back to. `:sha-<commit>` never moves: pinning it makes what is
      # running a fact anyone can read months later, and going back to a known
      # good build becomes re-pinning a tag instead of rebuilding from an old
      # commit. The Pro has carried this since day one; the Free did not, and
      # the gap only shows up on the day something has to be undone.
      - name: Create manifest lists and push
        run: |
          SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-10)"
          echo "Immutable tag for this build: $SHA_TAG"

          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHA_TAG \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-linux-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-linux-arm64

          echo "SHA_TAG=$SHA_TAG" >> "$GITHUB_ENV"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}

      - name: Deployment tag
        run: |
          echo "### Pin a deployment to this build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

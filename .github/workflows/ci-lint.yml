name: Lint

# Feedback rapido (~5 min): roda em todo push na main e em PRs.
# Pega o que o hook de pre-commit nao consegue rodar no Windows (rubocop).
#
# 🔴 O portao de seguranca (Brakeman + bundle-audit) mora AQUI desde 12/10/2026. Antes ele
# vivia na esteira de specs, que so roda depois do merge: uma PR ficava verde sem o portao
# ter aberto a boca, e foi assim que um achado novo entrou na main. Mesma licao da #22, por
# outro caminho — e e onde a outra edicao ja o tinha.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rubocop:
    name: Rubocop (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Rubocop
        run: bundle exec rubocop --parallel

  eslint:
    name: ESLint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run eslint

  # O nome do job aparece na lista de checagens, e "security-scan" dentro da esteira de specs
  # fazia quem procurava segurança não achar, e quem via o vermelho pensar que era teste
  # quebrado. Era o único job vermelho da `main` desde 07/10/2026 — e foi um job verde com o
  # nome antigo que delatou uma segunda cópia esquecida na outra edição.
  security-scan:
    name: Brakeman e bundle-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # 🔴 Os prazos vêm ANTES de qualquer checagem, e falham o build sozinhos quando vencem.
      # Lista de ignorados sem revisão é a mesma cegueira do portão que vive vermelho, só mais
      # silenciosa — e aqui ela custou caro: até 11/10/2026 esta lista tinha ONZE entradas mortas,
      # uma delas a CVE-2026-66066, o RCE do Active Storage, ignorado com o motivo "remover ao
      # chegar em 7.2.3.1+". Chegamos em 07/10 e ninguém voltou.
      #
      # Cada data mora NO PRÓPRIO arquivo, ao lado dos motivos. Repeti-la aqui criaria duas
      # verdades que um dia divergem — por isso este passo vai buscar, não guarda.
      #
      # Arquivo sem `REVISAR-EM` também falha: lista sem prazo volta a ser esquecimento.
      - name: Os prazos das listas de ignorados ainda valem?
        run: |
          set -euo pipefail
          HOJE=$(date -u +%F)
          FALHOU=0
          for ARQ in .bundler-audit.yml config/brakeman.ignore; do
            PRAZO=$(grep -oP 'REVISAR-EM:\s*\K[0-9]{4}-[0-9]{2}-[0-9]{2}' "$ARQ" | head -1 || true)
            if [ -z "$PRAZO" ]; then
              echo "::error::$ARQ nao tem REVISAR-EM. Lista de ignorados sem prazo volta a ser esquecimento."
              FALHOU=1
              continue
            fi
            echo "$ARQ: revisar em $PRAZO (hoje e $HOJE)"
            if [ "$HOJE" \> "$PRAZO" ]; then
              echo "::error::A lista de ignorados de $ARQ venceu em $PRAZO. Releia os motivos escritos no arquivo, confira se a restricao que impedia a correcao caiu, e so entao mexa na data."
              FALHOU=1
            fi
          done
          [ "$FALHOU" -eq 0 ]

      # O que está sendo ignorado aparece em TODA execução, de propósito: ignorar em silêncio é
      # como uma lista destas deixa de ser decisão e vira esquecimento.
      #
      # O achado REAL do Brakeman é reimpresso em separado a cada execução. Ele está ignorado
      # porque não há conserto nosso possível hoje (o Rails 7.2 é a linha do Chatwoot 4.18), não
      # porque foi perdoado.
      - name: O que esta sendo ignorado
        run: |
          set -euo pipefail
          echo "--- bundle-audit ---"
          grep -E '^\s+- ' .bundler-audit.yml
          echo "--- brakeman: $(jq '.ignored_warnings|length' config/brakeman.ignore) achados, cada um com o motivo escrito ---"
          jq -r '.ignored_warnings[] | select(.note | startswith("REAL")) | "AINDA ABERTO (real): \(.warning_type) em \(.file):\(.line)"' config/brakeman.ignore

      # Era `continue-on-error: true` com um comentário dizendo "35 achados preexistentes". Eram
      # 40, e o comentário tinha envelhecido sem ninguém notar — que é o retrato do problema: um
      # portão que aceita qualquer número deixa entrar o 41º sem ninguém ver.
      #
      # Os 40 foram lidos um a um em 11/10/2026 e estão em config/brakeman.ignore COM o motivo de
      # cada um. A partir daqui, achado novo para o build.
      - name: Run Brakeman
        run: bundle exec brakeman -q --no-pager

      - name: Run bundle-audit
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check --config .bundler-audit.yml

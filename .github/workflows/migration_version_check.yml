name: Migration Version Check

on:
  pull_request:
    paths:
      - 'db/migrate/**'

concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration_version_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The jumps that bring a new Chatwoot base carry the base's own migrations, and some of them have rounded
      # versions that are already released and applied elsewhere: they cannot be renamed. The rule stays for
      # every other pull request.
      - name: Reject hand-written migration versions
        if: ${{ !startsWith(github.event.pull_request.title, 'Base do Chatwoot') }}
        run: |
          rounded=$(git diff --name-only --diff-filter=AR HEAD^1 HEAD -- db/migrate | grep -E '^db/migrate/[0-9]{10}0000_' || true)
          if [ -n "$rounded" ]; then
            echo "::error::Rounded migration versions collide across branches. Regenerate with 'bundle exec rails g migration':"
            echo "$rounded"
            exit 1
          fi

      - name: Reject duplicate migration versions
        run: |
          duplicates=$(ls db/migrate | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration versions break db:migrate:"
            echo "$duplicates"
            exit 1
          fi

# Avisos de segurança que este projeto conhece e decidiu conviver — por ora.
#
# 🔴 POR QUE ESTE ARQUIVO FOI REESCRITO EM 11/10/2026: ele tinha 14 entradas, e onze já não
# correspondiam a nada. Entre elas estava a CVE-2026-66066 — a execução remota de código no Active
# Storage — ignorada com o motivo "sem correção no Rails 7.1, remover ao chegar em 7.2.3.1+". A
# `.43` subiu para o `rails 7.2.3.2` em 07/10 e ninguém voltou aqui. Enquanto a linha existisse, o
# portão ficaria calado se o RCE voltasse.
#
# As onze saíram depois de MEDIR, não de supor: o `bundle-audit` rodou contra este `Gemfile.lock`
# com a lista VAZIA, num contêiner Ruby descartável, e acusou exatamente seis avisos. As dez CVEs
# da era Rails 7.1 e a CVE-2021-41098 não aparecem mais.
#
# ✅ E no mesmo dia os seis viraram QUATRO: as duas do `devise` saíram subindo para o `devise 5.0.4`
# (ver a nota no fim deste arquivo). O conserto foi possível porque alguém releu o motivo e ele já
# não era verdade — que é exatamente o serviço que a revisão com prazo existe para prestar.
#
# 🔴 E havia o outro lado do mesmo defeito: três dos seis reais NÃO estavam listados, então o
# `security-scan` do Free vivia VERMELHO — era o único job vermelho da `main`. Um portão que vive
# vermelho não acusa mais nada: o olho lê "fail" e completa "é o de sempre". Foi assim que o RCE
# ficou escondido por meses atrás deste mesmo passo.
#
# 🔴 E POR QUE ELE TEM PRAZO: lista de ignorados sem revisão é a mesma cegueira, só mais
# silenciosa. O workflow falha sozinho quando a data abaixo passar, obrigando a reexaminar em vez
# de esquecer — e falha também se alguém apagar a data.
#
# 🔴 ESTA LISTA VAI CRESCER, E O CRESCIMENTO É O DADO. A base do bundle-audit é baixada a cada
# execução. Quando uma gem presa por dependência acumula avisos — o `ruby_llm` chegou a ter TRÊS
# ReDoS de criticidade alta, até a base subir para a 2.0 —, a pergunta deixa de ser "ignoro mais um?"
# e passa a ser "por quanto tempo ainda dependemos disto?". É para essa conversa que a data existe.
#
# REVISAR-EM: 2026-11-07
#
# Ao revisar: conferir se a restrição que impede a correção caiu. Se caiu, subir a gem e APAGAR a
# linha daqui. Nunca estender a data sem reler o motivo. E nunca deixar linha que já não é acusada:
# foi assim que esta lista chegou a onze entradas mortas.

ignore:
  # rack-proxy 0.7.7 — GHSA-42qh-8mx8-7wqm
  # Correção: >= 1.0.3. IMPOSSÍVEL hoje: a gem vem do `vite_rails`, e o `vite_ruby` exige
  # `rack-proxy (~> 0.6, >= 0.6.1)` — ou seja, proíbe 1.x. Subir exige subir o vite_ruby primeiro.
  # ⚠️ O título do aviso diz "in rack-proxy 1.x", e a versão instalada é 0.7.7: vale conferir, na
  # revisão, se o alcance do aviso é largo demais e 0.x nunca teve o defeito.
  # O que o rack-proxy serve aqui é o proxy do servidor de desenvolvimento do vite — conferir
  # também se ele chega a ser carregado em produção.
  - GHSA-42qh-8mx8-7wqm

